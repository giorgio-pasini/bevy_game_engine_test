[package]
name = "snake"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = "0.19"
# Versions matched to what Bevy 0.19's own examples use, so they resolve from
# the existing registry cache. `rand` 0.10 renamed the `Rng` trait to `RngExt`.
rand = "0.10"
chacha20 = { version = "0.10", default-features = false, features = ["rng"] }

[features]
# Fast iteration: `cargo run --features dev`.
# Links Bevy as a shared library so rebuilds of *our* code skip relinking the
# whole engine. Deliberately opt-in — release builds stay statically linked,
# because a dynamically linked binary needs bevy_dylib shipped alongside it.
dev = ["bevy/dynamic_linking"]

# Bevy's recommended dev profile: lightly optimize our code, heavily optimize
# dependencies. Costs a slower first build, then pays back on every run.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

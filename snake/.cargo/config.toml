# Cap compiler parallelism.
#
# This machine is a 6-core / 12-thread i7-8750H with 32 GB RAM. Cargo defaults
# to one rustc per logical CPU (12), and because dependencies build at
# opt-level = 3, each heavy crate (bevy_render, bevy_pbr, wgpu, naga) can hold
# multiple GB during LLVM optimization. Twelve at once exhausted RAM and froze
# the machine during the first full build.
#
# 4 leaves cores and memory headroom so the box stays usable. Costs some wall
# time on a full rebuild; irrelevant for incremental rebuilds.
#
# `jobs` is not part of the artifact fingerprint, so changing it never forces a
# rebuild. Raise it if you move to a machine with more RAM per core.
[build]
jobs = 4

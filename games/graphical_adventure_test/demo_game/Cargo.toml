[package]
name = "demo_game"
version = "0.1.0"
edition = "2024"

[dependencies]
bevy = { workspace = true }
vn_core = { path = "../vn_core" }
ron = { workspace = true }
serde = { workspace = true }

# build.rs validates assets/scenes/*.ron and generates SceneId from them, so a
# broken jump or a missing image fails `cargo build` rather than appearing
# mid-playtest. It deliberately does NOT depend on vn_core — that would drag the
# whole Bevy graph into the build-dependency tree.
[build-dependencies]
ron = { workspace = true }
serde = { workspace = true }
# Decodes hotspot lookup images so their colours can be audited at build time.
#
# Safe to add despite `image` also sitting under Bevy: cargo's resolver 2/3
# resolves build-dependency features SEPARATELY from normal ones, so this cannot
# change the features of the copy the engine uses — which is the thing that would
# cost a full rebuild. Pinned to the version already in Cargo.lock so it comes
# from the registry cache.
image = { version = "=0.25.10", default-features = false, features = ["png", "webp"] }

[features]
# Must stay identical to vn_core's and snake's `dev` feature — see the note in
# ../vn_core/Cargo.toml. `vn_core/dev` is forwarded so enabling dev here enables
# it all the way down rather than producing two different Bevy configurations.
dev = ["bevy/dynamic_linking", "bevy/dev", "bevy/track_location", "vn_core/dev"]

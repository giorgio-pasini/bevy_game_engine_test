# Workspace root for all Bevy experiments.
#
# Why a workspace rather than independent projects sharing a target directory:
# a shared target dir alone gave only PARTIAL reuse. Measured on 2026-07-30, a
# second independent project reused the ~489 leaf third-party crates (wgpu,
# naga, winit, image, icu_*) but still rebuilt 31 bevy_* crates — bevy_ecs,
# bevy_reflect, bevy_render, bevy_ui, bevy_gltf — i.e. all the expensive ones.
#
# The cause was NOT differing versions (both lockfiles resolved identically).
# It was feature resolution: one project depended on `rand`/`chacha20` directly,
# which changed the enabled features on `glam`, and since essentially all of
# Bevy sits on top of glam, that difference cascaded through the whole engine.
#
# A workspace fixes the version half of that outright — one Cargo.lock, so every
# member resolves to identical versions. See the caveat below for the rest.

[workspace]
resolver = "3"
members = [
  "snake",
  "graphical_adventure_test/vn_core",
  "graphical_adventure_test/demo_game",
  "graphical_adventure_test/reuse_probe",
]

# Declare shared dependencies here and have every member use
# `bevy = { workspace = true }`. This is not cosmetic — it is what keeps artifact
# reuse working.
#
# CAVEAT worth understanding: cargo resolves features over the set of packages
# it is actually building. Building one member alone can enable a different
# feature set on a shared crate than building another member alone, which
# reintroduces the cascade above. Two ways to stay fast:
#   1. Keep members' dependency lists uniform (take them all from here), or
#   2. Build from this root so features unify across all members at once.
# Divergent artifacts are cached side by side, so this costs time once per
# configuration, never correctness.
[workspace.dependencies]
# Bevy 0.19 groups features into PROFILES; its own default is
# ["2d", "3d", "ui", "audio"], which is what we use plus the format features.
#
# "3d" is kept ON PURPOSE even though the current members are all 2D. A 3D test
# game is planned, and changing Bevy's feature set forces a full rebuild of the
# whole engine graph — so carrying 3D now costs build time once, while dropping
# and re-adding it later would cost two rebuilds. Same batching logic as the
# format features below.
#
# (It was briefly dropped. Worth knowing for the future: "bevy/dev" pulls in
# bevy_dev_tools, which depends on bevy_pbr, so dropping "3d" never removed
# bevy_pbr or bevy_light anyway. Only bevy_gltf, bevy_anti_alias and
# bevy_mikktspace actually went away.)
#
# "jpeg" is NOT in any default profile (only "png" and "hdr" are, via
# common_api), so it must be listed explicitly or .jpg assets fail to load at
# runtime. "mp3"/"wav" are listed now purely so a future audio format does not
# cost another rebuild. Still opt-in if ever needed: "dds" and
# "basis-universal" for GPU-compressed textures, "webp", "flac".
bevy = { version = "0.19", default-features = false, features = [
  "2d",
  "3d",
  "ui",
  "audio",
  # Image codecs. Only "png" and "hdr" come from the profiles (via common_api);
  # everything else is opt-in, and a missing codec is a RUNTIME failure — the
  # file loads as bytes and then fails to decode. build.rs checks asset
  # extensions against this list, so keep the two in step.
  #
  # There is no image equivalent of `audio-all-formats`, so these are listed
  # individually. Enabled generously on purpose: each addition costs a full
  # ~20-minute engine rebuild, and this is the third time an unsupported format
  # has interrupted work.
  "jpeg",
  "webp",
  "bmp",
  "tga",
  "qoi",
  "gif",
  "mp3",
  "wav",
] }

# Versions matched to what Bevy 0.19's own examples use, so they resolve from
# the existing registry cache. `rand` 0.10 renamed the `Rng` trait to `RngExt`.
rand = "0.10"
chacha20 = { version = "0.10", default-features = false, features = ["rng"] }

# Localisation tables and, later, save files. Versions match Bevy's own
# examples (see bevy/examples/asset/custom_asset.rs).
serde = { version = "1", features = ["derive"] }
ron = "0.12"
thiserror = "2"

# Profiles belong to the workspace root — cargo ignores `[profile.*]` in member
# manifests, which structurally prevents the drift that would silently break
# artifact sharing. Values must stay identical to what the cache was built with
# or everything recompiles.
#
# Bevy's recommended dev setup: lightly optimize our code, heavily optimize
# dependencies. Brutal first build, pays back on every run afterwards.
#
# Possible future saving: `debug = "line-tables-only"` would cut most of the
# ~2.6 GB of .pdb symbols while keeping usable backtraces — but changing the
# profile forces a full rebuild. Deliberately not set.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
